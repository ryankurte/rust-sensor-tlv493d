[package]
name = "sensor-tlv493d"
description = "Driver for the Infineon tlv493d 3-DoF I2C hall-effect sensor"
repository = "https://github.com/ryankurte/rust-sensor-tlv493d"
keywords = [ "embedded", "no_std", "sensor", "i2c", "tlv493d" ]
authors = ["ryan <ryan@kurte.nz>"]
license = "MPL-2.0"
version = "0.1.1"
edition = "2024"

[features]
default = ["std", "blocking"]
async = ["embedded-hal-async"]
blocking = ["embedded-hal"]
defmt = [ "dep:defmt" ]
math = [ "dep:libm" ]
std = [ "thiserror", "anyhow" ]
util = [ "linux-embedded-hal", "structopt", "simplelog", "ctrlc", "math", "embedded-io", "anyhow", "log" ]

[dependencies]
anyhow = { version = "1.0.33", optional = true }
bitflags = "2.10.0"
ctrlc = { version = "3.1.6", optional = true }
defmt = { version = "1.0.1", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-io = { version = "0.7.1", optional = true }
libm = { version = "0.2.15", optional = true }
linux-embedded-hal = { version = "0.4.0-alpha.0", optional = true }
maybe-async-cfg = "0.2.5"
simplelog = { version = "0.12.2", optional = true }
structopt = { version = "0.3.20", optional = true }
thiserror = { version = "2.0.18", optional = true }
log = { version = "0.4.29", optional = true }

[[bin]]
name = "tlv493d-util"
path = "src/util.rs"
required-features = [ "util" ]
